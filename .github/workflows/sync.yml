name: Daily sync

# The freshness pipeline: sync TMDB into Neon, then the media script
# fires the Vercel Deploy Hook so the bounded detail routes (which
# only build pages for database rows) get rebuilt with the new ids.
# A failed step fails the run, and GitHub emails the owner on failed
# scheduled runs — that email IS the alerting for a broken pipeline;
# the 7-day route revalidate is the safety net underneath it.
#
# Caveats, on the record:
# - GitHub suspends schedules after ~60 days without repo activity;
#   the workflow_dispatch button revives it.
# - This repo is public, so these logs are world-readable. Nothing
#   here or in the scripts echoes an env value, and all three values
#   live only in repository secrets (fork PRs never see secrets, and
#   this workflow has no pull_request surface at all).
on:
  schedule:
    # 09:30 UTC daily, before US evening traffic.
    - cron: "30 9 * * *"
  workflow_dispatch:

# The token gets read access only; the deploy is Vercel's, not git's.
permissions:
  contents: read

concurrency:
  group: daily-sync
  cancel-in-progress: false

jobs:
  sync:
    name: Sync & redeploy
    runs-on: ubuntu-latest
    steps:
      # persist-credentials off: install lifecycle scripts must not
      # find a token sitting in .git config.
      - uses: actions/checkout@v5
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      # This pipeline exists to produce pages; the script's env-gated
      # skip is right for local runs but a silent green here would
      # mean new rows never get pages. Until the Vercel un-pause lets
      # the hook exist, this step fails by design — keep the workflow
      # disabled in the Actions tab until the secret is set.
      - name: Require deploy hook
        env:
          VERCEL_DEPLOY_HOOK_URL: ${{ secrets.VERCEL_DEPLOY_HOOK_URL }}
        run: |
          if [ -z "$VERCEL_DEPLOY_HOOK_URL" ]; then
            echo "VERCEL_DEPLOY_HOOK_URL secret is not set; refusing a sync whose pages could never ship."
            exit 1
          fi
      # People first, media second: only sync-media fires the deploy
      # hook, so the rebuild picks up both syncs in one deploy.
      # Secrets are step-scoped: dependency install runs without them.
      # DATABASE_URL_ADMIN is the owner role — this workflow is the
      # only writer; CI reads with the ci_read role.
      - run: pnpm db:sync-people
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL_ADMIN }}
          TMDB_READ_ACCESS_TOKEN: ${{ secrets.TMDB_READ_ACCESS_TOKEN }}
      - run: pnpm db:sync
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL_ADMIN }}
          TMDB_READ_ACCESS_TOKEN: ${{ secrets.TMDB_READ_ACCESS_TOKEN }}
          VERCEL_DEPLOY_HOOK_URL: ${{ secrets.VERCEL_DEPLOY_HOOK_URL }}
