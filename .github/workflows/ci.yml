name: CI

# The token gets read access only; no job here writes to the repo.
permissions:
  contents: read

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quality:
    name: Lint & typecheck
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm lint
      # Next writes global route types into .next/types; a fresh checkout
      # doesn't have them and tsc fails on the scaffold itself without this.
      - run: pnpm exec next typegen
      - run: pnpm exec tsc --noEmit

  e2e:
    name: Build & e2e
    runs-on: ubuntu-latest
    steps:
      # persist-credentials off: install lifecycle scripts must not
      # find a token sitting in .git config.
      - uses: actions/checkout@v5
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      # The framework data cache carries the build's TMDB responses
      # between runs: the first build of a day refetches what the
      # 24h fetch revalidate has expired, and every later build that
      # day costs TMDB near zero. Restores the newest snapshot, saves
      # under this commit's key.
      - uses: actions/cache@v4
        with:
          path: .next/cache
          key: next-cache-${{ github.sha }}
          restore-keys: next-cache-
      - run: pnpm exec playwright install --with-deps
      # The detail routes prerender the whole catalog from the database
      # and TMDB (generateStaticParams + dynamicParams = false), so the
      # build needs both secrets — DATABASE_URL is the read-only
      # ci_read role. Step-scoped on purpose: dependency install runs
      # without them, the `pull_request` trigger never hands them to
      # fork PRs, and nothing here echoes them.
      - run: pnpm build
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          TMDB_READ_ACCESS_TOKEN: ${{ secrets.TMDB_READ_ACCESS_TOKEN }}
      # Playwright's webServer serves the build above via `pnpm start`.
      - run: pnpm test:e2e
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          TMDB_READ_ACCESS_TOKEN: ${{ secrets.TMDB_READ_ACCESS_TOKEN }}

  # Audits the deployed site, not this build: CI has no database, so the
  # deployed pages are the only honest render. Push-to-main only, so a PR
  # is never failed by a production regression it didn't cause.
  # Parked for Vercel's courtesy window (to ~2026-09-24): every audit is
  # nine document loads against the metered site, three of them /search
  # renders, and Bot Protection challenges the runner anyway. To restore:
  # put the push condition back and add a firewall allow rule for the job.
  lighthouse:
    name: Lighthouse
    if: false # was: github.event_name == 'push'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      # Budgets live in .lighthouserc.json, ratcheted just under the
      # measured scores so a slip fails the job.
      - run: pnpm lighthouse
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: lighthouse-reports
          path: .lighthouseci-reports/
