name: CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quality:
    name: Lint & typecheck
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm lint
      # Next writes global route types into .next/types; a fresh checkout
      # doesn't have them and tsc fails on the scaffold itself without this.
      - run: pnpm exec next typegen
      - run: pnpm exec tsc --noEmit

  e2e:
    name: Build & e2e
    runs-on: ubuntu-latest
    # The detail routes prerender the whole catalog from the database
    # and TMDB (generateStaticParams + dynamicParams = false), so the
    # build now requires both secrets. The `pull_request` trigger never
    # hands secrets to fork PRs; nothing here echoes them, and the
    # deploy hook URL is deliberately absent from CI.
    env:
      DATABASE_URL: ${{ secrets.DATABASE_URL }}
      TMDB_READ_ACCESS_TOKEN: ${{ secrets.TMDB_READ_ACCESS_TOKEN }}
    steps:
      - uses: actions/checkout@v5
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm exec playwright install --with-deps
      - run: pnpm build
      # Playwright's webServer serves the build above via `pnpm start`.
      - run: pnpm test:e2e

  # Audits the deployed site, not this build: CI has no database, so the
  # deployed pages are the only honest render. Push-to-main only, so a PR
  # is never failed by a production regression it didn't cause.
  lighthouse:
    name: Lighthouse
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      # Budgets live in .lighthouserc.json, ratcheted just under the
      # measured scores so a slip fails the job.
      - run: pnpm lighthouse
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: lighthouse-reports
          path: .lighthouseci-reports/
